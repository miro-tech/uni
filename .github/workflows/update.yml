name: BoSVPN Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8,20 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests brotli

      - name: Run parser.py
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          echo "========================================"
          echo "Running parser.py"
          echo "========================================"

          python parser.py

      - name: Check configs.txt
        run: |
          echo "========================================"
          echo "Checking configs.txt"
          echo "========================================"

          if [ ! -f configs.txt ]; then
            echo "ERROR: configs.txt was not created!"
            exit 1
          fi

          echo "[+] configs.txt exists"

          echo ""
          echo "Size:"
          wc -c configs.txt

          echo ""
          echo "Lines:"
          wc -l configs.txt

          echo ""
          echo "VLESS:"
          grep -c '^vless://' configs.txt || true

          echo ""
          echo "Hysteria2:"
          grep -c '^hysteria2://' configs.txt || true

          echo ""
          echo "Content:"
          cat configs.txt
