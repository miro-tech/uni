name: Update Profiles

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8,20 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT GITHUB REPOSITORY
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ======================================================
      # RUN PARSER
      # ======================================================

      - name: Run parser
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          echo "========================================"
          echo "Running parser.py"
          echo "========================================"

          python parser.py

          echo ""
          echo "========================================"
          echo "Checking configs.txt"
          echo "========================================"

          if [ ! -f configs.txt ]; then
            echo "ERROR: configs.txt was not created!"
            echo ""
            echo "Current directory:"
            pwd
            echo ""
            echo "Files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "[+] configs.txt exists"

          echo ""
          echo "Size:"
          wc -c configs.txt

          echo ""
          echo "Lines:"
          wc -l configs.txt

          echo ""
          echo "First configs:"
          head -20 configs.txt


      # ======================================================
      # GITVERSE
      # ======================================================

      - name: Push configs to GitVerse
        env:
          GV_USER: ${{ secrets.GV_USER }}
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
        run: |

          echo "========================================"
          echo "Checking GitVerse credentials"
          echo "========================================"

          if [ -z "$GV_USER" ]; then
            echo "ERROR: GV_USER is empty!"
            exit 1
          fi

          if [ -z "$GV_TOKEN" ]; then
            echo "ERROR: GV_TOKEN is empty!"
            exit 1
          fi


          echo "========================================"
          echo "Cloning GitVerse repository"
          echo "========================================"

          rm -rf gitverse

          git clone \
            "https://${GV_USER}:${GV_TOKEN}@gitverse.ru/mirgittech/bos.git" \
            gitverse


          echo "========================================"
          echo "Copying configs.txt"
          echo "========================================"

          cp \
            configs.txt \
            gitverse/configs.txt


          echo "========================================"
          echo "Git status"
          echo "========================================"

          cd gitverse

          git status

          echo ""
          echo "configs.txt:"
          wc -c configs.txt
          wc -l configs.txt


          # ==================================================
          # GIT CONFIG
          # ==================================================

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"


          # ==================================================
          # COMMIT
          # ==================================================

          git add configs.txt

          if git diff --cached --quiet; then
            echo ""
            echo "[+] configs.txt не изменился"
            echo "[+] Новый commit не требуется"
            exit 0
          fi

          git commit \
            -m "Auto update configs $(date -u '+%Y-%m-%d %H:%M:%S UTC')"


          # ==================================================
          # PUSH
          # ==================================================

          echo ""
          echo "========================================"
          echo "Pushing to GitVerse"
          echo "========================================"

          git push origin master

          echo ""
          echo "[+] GitVerse успешно обновлён"
