name: Update Profiles

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8,20 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run parser
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python parser.py
          
      - name: Push configs to GitVerse
        env:
          GV_USER: ${{ secrets.GV_USER }}
          GV_TOKEN: ${{ secrets.GV_TOKEN }}
        run: |
          git clone https://${GV_USER}:${GV_TOKEN}@gitverse.ru/mirgittech/bos.git gitverse

          cp configs.txt gitverse/configs.txt

          cd gitverse

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add configs.txt
          git commit -m "Auto update configs $(date)" || exit 0
          git push origin master
