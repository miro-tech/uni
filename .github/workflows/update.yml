name: BoSVPN Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8,20 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests brotli

      - name: Run parser.py
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          echo "========================================"
          echo "Running parser.py"
          echo "========================================"
          python parser.py

      - name: Show result
        if: always()
        run: |
          echo "========================================"
          echo "configs.txt"
          echo "========================================"

          if [ -f configs.txt ]; then
            wc -c configs.txt
            wc -l configs.txt
            cat configs.txt
          else
            echo "configs.txt not found"
          fi
